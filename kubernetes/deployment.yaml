apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-app
  labels:
    app: my-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      containers:
      - name: angular-app
        image: 758002376518.dkr.ecr.us-east-1.amazonaws.com/angular-eks-repo:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 80